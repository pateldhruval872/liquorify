name: Security audit

# Covers the gap Dependabot leaves on this pnpm workspace: transitive
# advisories, which is nearly all of ours. Its fallback for them
# (dependabot-core#14589) is gated behind the `enable_audit_fix_fallback`
# flag, and while dependabot-core#15104 is open it desynchronizes the lockfile
# from package.json in a way our frozen-lockfile CI rejects.
#
# This job runs `pnpm audit --fix` on a schedule — pinning patched versions via
# overrides while honoring the supply-chain settings in pnpm-workspace.yaml
# (minimumReleaseAge, trustPolicy) — and opens a PR with the result for review.
# See the npm entry in .github/dependabot.yml for the full rationale.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Report current advisories
        run: pnpm audit --audit-level=low || true

      - name: Pin available fixes via overrides
        id: fix
        # `--fix` must be given an explicit method: pnpm 11 rejects both the
        # documented bare `--fix` and `--fix --ignore-unfixable` (it binds the
        # next flag as the method and errors out). No `|| true` here — a broken
        # invocation must fail the job rather than silently open an empty PR.
        # Deliberately unfixed advisories live in `auditConfig.ignoreGhsas` in
        # pnpm-workspace.yaml, so they are not re-proposed here every week.
        #
        # pnpm can name a fix version that was never published (deepmerge
        # 4.3.2 for GHSA-gcqx-w48m-w2h4), and the lockfile refresh then fails.
        # Each version the fix newly admits is looked up: one the registry says
        # does not exist is dropped with its override, and its advisory stays
        # in the report. Any other registry error fails the job.
        run: |
          exclusions() {
            sed -n "/^minimumReleaseAgeExclude:/,/^[^ ]/{/^  - /{s/^  - //;s/^'//;s/'\$//;p}}" pnpm-workspace.yaml | sort
          }
          exclusions > "$RUNNER_TEMP/excluded-before"
          pnpm audit --ignore-unfixable --fix=override
          skipped=""
          for spec in $(exclusions | comm -13 "$RUNNER_TEMP/excluded-before" -); do
            if npm view "$spec" version --json > "$RUNNER_TEMP/view.json" 2>/dev/null; then continue; fi
            if ! grep -q '"code": "E404"' "$RUNNER_TEMP/view.json"; then
              echo "::error::Could not look up $spec on the registry"; cat "$RUNNER_TEMP/view.json"; exit 1
            fi
            echo "::warning::$spec is not published, so its advisory stays unresolved"
            skipped="$skipped $spec"
            name=$(printf '%s' "${spec%@*}" | sed 's/[]\/.^$*+?(){}|[]/\\&/g')
            version=$(printf '%s' "${spec##*@}" | sed 's/[.+]/\\&/g')
            grep -vE "^  - '?${name}@${version}'?\$|^  '?${name}@[^:]*'?: '?\^${version}'?\$" pnpm-workspace.yaml > "$RUNNER_TEMP/workspace.yaml"
            cp "$RUNNER_TEMP/workspace.yaml" pnpm-workspace.yaml
          done
          echo "skipped=${skipped# }" >> "$GITHUB_OUTPUT"
          pnpm install --lockfile-only

      - name: Collect remaining advisories
        id: audit
        run: |
          {
            echo 'report<<REPORT_EOF'
            pnpm audit --audit-level=low 2>&1 || true
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # PRs opened with the default GITHUB_TOKEN do not trigger CI
          # workflows. Provide a PAT or GitHub App token here if the test
          # suite should run on the generated PR automatically.
          branch: chore/security-audit
          base: main
          title: 'chore(deps): weekly security audit'
          commit-message: 'chore(deps): pin security fixes via pnpm overrides'
          labels: |
            dependencies
            security
          body: |
            Automated `pnpm audit --fix` run. Patched versions are pinned via
            `overrides` in `pnpm-workspace.yaml`, honoring the repo's
            supply-chain settings (`minimumReleaseAge`, `trustPolicy`).

            Fills the gap left by Dependabot, which cannot run security updates
            on this pnpm workspace (`Unsupported protocol "workspace:"`,
            dependabot-core#13177).

            **Review the override bumps and confirm CI before merging.**

            Fix versions that are not published, so their advisories stay
            unresolved: ${{ steps.fix.outputs.skipped || 'none' }}

            <details><summary>Audit report after fixes</summary>

            ```
            ${{ steps.audit.outputs.report }}
            ```

            </details>
